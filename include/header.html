<script> /* append: 자식으로 추가 */
        let gnbArray = ['멜론차트', 'Melon', '스타포스트', '매거진', '뮤직어워드', '뮤직웨이브'];
        let lnbArray = [
            ['TOP 100', 'HOT 100', '일간', '주간', '월간', '시대'],
            ['멜론DJ', '멜론TV'],
            ['NOW', '아티스트 랭킹', '마이 랭킹'],
            ['연재중 매거진', '완결된 매거진', '에디션m', '한국 대중음악 명반 100', 'K-POP 명곡 100'],
            [],
            []
        ];
        for(let i=0; i<gnbArray.length; i++){
            $('.gnb').append(`
                <li>
                    <a href="#"><span>${gnbArray[i]}</span></a>
                </li>
            `)

            if(lnbArray[i].length > 0){
                $('.gnb > li').eq(i).append('<ul class="lnb"></ul>')
                for(let j=0; j<lnbArray[i].length; j++){
                    $('.gnb > li').eq(i).find('.lnb').append(`
                        <li>
                            <a href="#">${lnbArray[i][j]}</a>
                        </li>
                    `)
                };
            }
            $('.gnb > li').eq(1).addClass('melon')
        };
    </script>
